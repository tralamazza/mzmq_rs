[package]
name = "mzmq-sizing"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "mzmq-sizing"
path = "src/main.rs"

[[bin]]
name = "mzmq-sizing-baseline"
path = "src/baseline.rs"

[features]
default = []
sync = ["mzmq/sync", "dep:embedded-io"]
async = ["mzmq/async", "dep:embedded-io-async", "dep:embedded-io"]
plain = ["mzmq/plain"]
std = ["mzmq/std"]

[dependencies]
mzmq = { path = "..", default-features = false }
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m-rt = "0.7"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
