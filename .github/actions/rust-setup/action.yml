name: Rust Setup (Production, Pinned sccache)
description: Installs Rust toolchain + sccache v0.10+ with local cache backend

inputs:
  components:
    description: Rust components (rustfmt, clippy)
    required: false
    default: ""

  targets:
    description: Rust compilation targets
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install sccache (pinned)
      uses: taiki-e/install-action@v2
      with:
        tool: sccache@0.10.0

    - name: Show sccache version
      shell: bash
      run: sccache --version

    - name: Restore sccache cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-sccache-

    - name: Configure sccache (local-only)
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
