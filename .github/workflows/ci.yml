name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup
        with:
          components: "rustfmt, clippy"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup
        with:
          targets: "thumbv7em-none-eabihf"

      - run: cargo test --no-default-features
      - run: cargo build --no-default-features --target thumbv7em-none-eabihf

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - run: uv sync
      - run: cargo test --features python-tests -- --test-threads=1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.10.0

      - name: Restore sccache cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-nightly-

      - run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - run: cargo fuzz build

      - run: cargo fuzz run frame_decoder -- -max_total_time=30
      - run: cargo fuzz run greeting_parser -- -max_total_time=30
      - run: cargo fuzz run connection_feed -- -max_total_time=30

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - run: cargo llvm-cov --no-report --features sync,async
      - run: cargo llvm-cov report --html
      - run: bash scripts/coverage-table.sh >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html/
