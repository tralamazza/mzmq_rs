name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup
        with:
          components: "rustfmt, clippy"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup
        with:
          targets: "thumbv7em-none-eabihf"

      - run: cargo test --no-default-features
      - run: cargo build --no-default-features --target thumbv7em-none-eabihf

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - run: uv sync
      - run: cargo test --features python-tests,plain -- --test-threads=1

  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - run: cargo fuzz build --target x86_64-unknown-linux-gnu

      - run: cargo fuzz run frame_decoder --target x86_64-unknown-linux-gnu -- -runs=2000000
      - run: cargo fuzz run greeting_parser --target x86_64-unknown-linux-gnu -- -runs=2000000
      - run: cargo fuzz run connection_feed --target x86_64-unknown-linux-gnu -- -runs=2000000
      - run: cargo fuzz run null_ready_parser --target x86_64-unknown-linux-gnu -- -runs=2000000
      - run: cargo fuzz run plain_hello_parser --target x86_64-unknown-linux-gnu -- -runs=2000000
      - run: cargo fuzz run sub_table --target x86_64-unknown-linux-gnu -- -runs=2000000
      - run: cargo fuzz run group_table --target x86_64-unknown-linux-gnu -- -runs=2000000
      - run: cargo fuzz run radio_connection_feed --target x86_64-unknown-linux-gnu -- -runs=2000000
      - run: cargo fuzz run frame_encoder --target x86_64-unknown-linux-gnu -- -runs=2000000

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

      - name: File issue on fuzz crash
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'fuzz/artifacts';
            if (!fs.existsSync(dir)) { console.log('no artifacts dir'); return; }
            const targets = fs.readdirSync(dir)
              .filter(d => fs.statSync(path.join(dir, d)).isDirectory())
              .map(d => ({ name: d, files: fs.readdirSync(path.join(dir, d)) }))
              .filter(t => t.files.length > 0);
            if (targets.length === 0) { console.log('no crash artifacts'); return; }
            const names = targets.map(t => t.name);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'fuzz',
            });
            const matched = issues.filter(i =>
              names.some(n => i.title.includes(n))
            );
            if (matched.length > 0) {
              const seen = new Set();
              for (const issue of matched) {
                if (seen.has(issue.number)) continue;
                seen.add(issue.number);
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Another fuzz crash occurrence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTargets: ${names.join(', ')}`,
                });
              }
              return;
            }
            const title = `Fuzz crash: ${names.join(', ')}`;
            const body = `## Fuzz Crash Detected\n\nCI run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n${targets.map(t => `**${t.name}**\n${t.files.map(f => '- `' + f + '`').join('\n')}`).join('\n\n')}\n\n---\n_Automated issue from CI fuzz workflow._`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['fuzz', 'bug'],
            });

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - run: uv sync

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - run: cargo llvm-cov --no-report --all-features
      - run: cargo llvm-cov report --html
      - run: bash scripts/coverage-table.sh >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html/
