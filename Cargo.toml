[package]
name = "mzmq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Minimal no_std ZMQ (ZMTP 3.1) PUB transport for embedded"
repository = "https://github.com/tralamazza/mzmq_rs"
homepage = "https://github.com/tralamazza/mzmq_rs"
documentation = "https://docs.rs/mzmq"

[package.metadata.docs.rs]
features = ["std", "sync", "plain"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["sync"]
std = []
sync = ["dep:embedded-io"]
async = ["dep:embedded-io-async"]
plain = []
python-tests = []

[dependencies]
heapless = "0.9"
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
wait-timeout = "0.2"
hex = "0.4"
embedded-io-adapters = { version = "0.7", features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "time", "net"] }
