[package]
name = "mzmq"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Minimal no_std ZMQ (ZMTP 3.1) PUB transport for embedded"
repository = "https://github.com/tralamazza/mzmq_rs"
homepage = "https://github.com/tralamazza/mzmq_rs"
documentation = "https://docs.rs/mzmq"
keywords     = ["zmq", "zmtp", "no-std", "embedded", "pubsub"]
categories   = ["embedded", "network-programming", "no-std"]

[package.metadata.docs.rs]
all-features  = true
targets       = ["x86_64-unknown-linux-gnu"]
rustdoc-args  = ["--cfg", "docsrs"]

[features]
default = ["sync"]
std = []
sync = ["dep:embedded-io"]
async = ["dep:embedded-io-async"]
smoltcp = ["dep:smoltcp", "sync"]
plain = []
python-tests = []

[dependencies]
heapless = "0.9"
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }
smoltcp = { version = "0.13", optional = true, default-features = false, features = ["socket-tcp", "proto-ipv4", "medium-ip"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
wait-timeout = "0.2"
hex = "0.4"
embedded-io-adapters = { version = "0.7", features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "time", "net"] }
smoltcp = { version = "0.13" }
